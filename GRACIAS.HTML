<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Gracias por tu pedido! | La Tiendita Creativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="main.css">
  <style>.thanks-wrap{min-height:100vh;display:grid;place-items:center;background:var(--cream);padding:25px}.thanks-card{max-width:600px;text-align:center;background:var(--paper);padding:60px 35px;border:1px solid var(--line);box-shadow:var(--shadow)}.thanks-icon{font-size:3.5rem;color:var(--clay)}.thanks-card h1{font-size:3rem}.thanks-card p{color:var(--muted);line-height:1.8}.order-summary{text-align:left;background:var(--cream);padding:18px;margin:25px 0}.summary-line{display:flex;justify-content:space-between;gap:15px;padding:6px 0}</style>
</head>
<body><main class="thanks-wrap"><section class="thanks-card"><div class="thanks-icon">✿</div><span class="eyebrow">LA TIENDITA CREATIVA</span><h1>¡Gracias por<br><em>tu pedido!</em></h1><p>Tu pedido de demostración quedó registrado en esta sesión. Nos encanta que apoyes lo hecho a mano.</p><div class="order-summary" id="summary"><p class="mb-0">Preparando resumen...</p></div><a href="index.html" class="btn btn-earth">Volver a la tienda ↗</a></section></main>
<script>
const order = JSON.parse(sessionStorage.getItem("ultimoPedido") || "null");
const box = document.getElementById("summary");
if (!order) { box.innerHTML = "<p class='mb-0'>No hay un pedido reciente. Puedes volver al catálogo para explorar.</p>"; }
else {
  const rows = order.items.map(item => `<div class="summary-line"><span>${item.name}</span><strong>$${item.price} MXN</strong></div>`).join("");
  box.innerHTML = `<strong>Resumen de tu pedido</strong>${rows}<hr><div class="summary-line"><strong>Total</strong><strong>$${order.total} MXN</strong></div><small class="text-muted">Compra simulada · Sin cobro real</small>`;
  sessionStorage.removeItem("ultimoPedido");
}
</script></body></html>
